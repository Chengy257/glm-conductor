# GLM Conductor 插件静态校验（整改规范 §25/§26）。
# 实质步骤：ruff 静态检查（最小规则集 F+E9，配置见 .ruff.toml，版本固定
# 保证可复现）→ 插件静态校验脚本 → 插件装载冒烟 → 单元测试。
# 无 benchmark、无模型调用、无外部 API（pip 安装 ruff 是唯一联网步骤）。
# 矩阵覆盖 Linux+Windows × Python 最低(3.8)/最新。
name: validate-plugin

on:
  push:
  pull_request:

jobs:
  validate:
    name: Static plugin validation (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: ruff lint（F+E9 最小规则集，全矩阵统一固定版本 0.4.4——
          支持 py37 target 且可安装于 3.8 与 3.13）
        run: |
          python -m pip install ruff==0.4.4
          python -m ruff check plugins/ scripts/ tests/
      - name: 插件静态校验（validate_plugin.py 15 项）
        run: python scripts/validate_plugin.py
      - name: 插件装载冒烟（清单/结构/runtime import，零网络零模型调用）
        run: python scripts/smoke_plugin_load.py
      - run: python -m unittest discover -s tests -v
