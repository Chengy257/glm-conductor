# GLM Conductor 插件静态校验（整改规范 §25/§26）。
# 唯一实质步骤是运行本地静态校验脚本：无 benchmark、无模型调用、无外部 API。
# 矩阵覆盖 Linux+Windows × Python 最低(3.8)/最新。
name: validate-plugin

on:
  push:
  pull_request:

jobs:
  validate:
    name: Static plugin validation (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/validate_plugin.py
      - run: python -m unittest discover -s tests -v
